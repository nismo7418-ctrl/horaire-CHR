name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile app.py llm.py solveur.py config.py state.py backtest.py auth.py exporter.py

      - name: Tests
        run: |
          python test_solveur.py
          python test_p3.py
          python test_app.py
